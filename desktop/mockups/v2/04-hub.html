<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hub — start from the computer, then everything about it</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css">
<style>
.d04{--bg:#fafafa;--sf:#fff;--rz:#f4f4f5;--ac:#0f766e;--ac-ink:#0f766e;--ac-soft:rgba(15,118,110,.08);--font:"DM Sans",system-ui,sans-serif;--rc:14px;display:flex;flex-direction:column}
.d04 .top{height:60px;flex:none;display:flex;align-items:center;gap:8px;padding:0 28px;border-bottom:1px solid var(--line)}
.d04 .crumb{display:flex;align-items:center;gap:8px;font-size:15px;margin-right:auto}
.d04 .crumb button{color:var(--t2)} .d04 .crumb b{font-weight:500}
.d04 .glob{display:flex;gap:2px}
.d04 .glob .k-navi{height:36px;padding:0 12px;border-radius:8px;gap:8px;font-size:13px}
.d04 .glob .k-navi:hover,.d04 .glob .k-navi.on{background:var(--rz);color:var(--t1)}
.d04 .stage{flex:1;overflow:auto;padding:24px 28px;min-height:0}
.d04 .stage:has(.k-files){display:flex;flex-direction:column;overflow:hidden}.d04 .stage .k-files{flex:1;min-height:0}
.d04 .mrow{display:grid;grid-template-columns:40px 1.4fr 1fr 1.2fr auto;gap:20px;align-items:center;padding:20px;border-radius:var(--rc);background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px;cursor:pointer}
.d04 .mrow:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.d04 .mrow .ic{width:40px;height:40px;border-radius:10px;background:var(--rz);display:grid;place-items:center;color:var(--t2)}
.d04 .mrow b{font-weight:500;font-size:17px;display:flex;gap:8px;align-items:center} .d04 .mrow small{color:var(--t3);display:block}
.d04 .mrow .st{display:grid;gap:4px;font-size:13px;color:var(--t2)}
.d04 .mrow .acts{display:flex;gap:8px}
.d04 .mrow .go{width:32px;display:grid;place-items:center;color:var(--t3)} .d04 .mrow:hover .go{color:var(--t1)}
.d04 .mrow.st-bad{box-shadow:inset 0 0 0 1px rgba(220,38,38,.35)}
.d04 .ask{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--rc);background:var(--rz);margin-bottom:24px}
.d04 .ask b{font-weight:500} .d04 .ask .mono{font-size:18px;letter-spacing:.06em}
.d04 .chead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.d04 .chead h1{font:500 26px var(--font);margin:0}
.d04 .ctabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.d04 .ctabs button{height:40px;padding:0 12px;color:var(--t2);box-shadow:inset 0 -2px 0 transparent;display:flex;gap:8px;align-items:center}
.d04 .ctabs button.on{color:var(--t1);box-shadow:inset 0 -2px 0 var(--t1)}
.d04 .ctabs .sp{flex:1}
.d04 .stage .k-ph{display:none}
.d04 .stage.home .k-ph,.d04 .stage.glob .k-ph{display:flex}
</style>
<script src="_files.js"></script><script defer src="_nav.js"></script><script src="kit.js"></script></head>
<body class="mk"><div class="win d04">
 <header class="top"><nav class="crumb" id="crumb"></nav><div class="glob" id="glob"></div><span id="acts" style="display:contents"></span></header>
 <main class="stage" id="st"></main>
</div>
<script>
window.IDEA='Everything starts from a computer. The home screen lists your computers with what each needs; open one and its files, devices, storage, apps, trash and links are tabs of that computer. Only things that span all computers (transfers, search, history, settings) live in the top bar.';
window.MAP=[['Navigation','Home lists computers; a computer has tabs; global pages at the top right',1],['Switch computer','Breadcrumb Computers, then the computer',2],['Connect and trust','Add a computer on the home screen',1],['Servers and status','Home rows; Status and the card menu in the computer header',1],['Files and preview','Files tab of a computer; right-click for every action',1],['Upload and download','Upload in Files, Ctrl U, drag; Download in Details, Ctrl D',2],['Pair a phone','Devices tab of the computer, or the QR icon',2],['Pairing requests','Shown on the home screen with the match code',1],['Transfers','Transfers at the top right, with a count',1],['Search','Search at the top right, or /',1],['Tools','Storage, Apps, Trash and Share links are computer tabs; favorites, offline and sync under Favorites',2],['History and audit','History at the top right',1],['Settings','Settings at the top right',1],['Tray and notifications','Bell beside the account',1]];
const I=K.I,st=document.getElementById('st');
document.getElementById('acts').innerHTML=K.C.actions({no:['refresh']});
const G=[['transfers','transfer','Transfers','3'],['search','search','Search'],['tools','star','Favorites'],['history','history','History'],['settings','sliders','Settings']];
const CT=[['files','dir','Files'],['devices','phone','Devices'],['store','file_cabinet','Storage'],['apps','toolbox','Apps'],['trash','wastebasket','Trash'],['share','link','Share links']];
let tab='files';
const home=()=>K.head('Your computers','4 saved · 2 connected',K.btn('Add a computer',{i:'plus',k:'pri',a:'dlg:newconn'}))+`<div class="ask">${K.E('phone',22)}<span><b>Pixel 9</b> asks to join studio-pc. Accept if it shows <span class="mono">4829 1307</span></span><span class="sp"></span>${K.btn('Accept…',{k:'sm pri',a:'dlg:accept'})}${K.btn('Reject',{k:'sm'})}${K.btn('1 more',{k:'sm ghost',a:'ctab:devices'})}</div>`+K.D.servers.map(s=>`<div class="mrow st-${s.dot}" data-k="${s.state==='Connected'?'open:'+s.id:s.state==='Key changed'?'dlg:keychanged':'menu:server'}"><span class="ic">${K.mach(s,26)}</span><div><b>${s.name} ${K.tag(s.id)}</b><small class="mono">${s.addr} · ${s.route}</small></div><div class="st"><span>${K.dot(s.dot)} ${s.state}${s.ms?` · <span class="mono">${s.ms} ms</span>`:''}</span><small>${s.sys} · agent ${s.ver}</small></div><div class="st"><span class="mono">${s.used>=1000?(s.used/1000).toFixed(1)+' TB':s.used+' GB'} of ${s.total>=1000?(s.total/1000).toFixed(1)+' TB':s.total+' GB'}</span>${K.bar(s.used/s.total*100)}</div><div class="acts">${s.state==='Connected'?`<span class="go">${I('chevr')}</span>`:s.state==='Key changed'?K.btn('Review key…',{k:'sm warn'}):K.btn('Wake computer',{i:'power',k:'sm',a:'toast:Wake signal sent to media-mini'})}${K.ib('more','More','menu:server')}</div></div>`).join('');
const comp=(body)=>`<div class="chead"><h1>studio-pc</h1>${K.tag('studio')}<span class="k-state">${K.dot('ok')}Connected · <span class="mono">12 ms LAN</span></span><span class="sp" style="flex:1"></span>${K.btn('Status…',{k:'sm',i:'activity',a:'dlg:status'})}${K.ib('more','More for studio-pc','menu:server')}</div><div class="ctabs">${CT.map(t=>`<button class="${tab===t[0]?'on':''}" data-k="ctab:${t[0]}">${K.E(t[1],16)}${t[2]}${t[0]==='devices'?' <em class="k-badge bad">2</em>':''}</button>`).join('')}</div>`+body;
const body=()=>tab==='files'?K.V.files({}):tab==='devices'?K.V.devices():K.V.tool[tab]();
K.mount({stage:st,state:{view:'home'},views:{home,computer:()=>comp(body()),files:()=>{tab='files';return comp(body())},devices:()=>{tab='devices';return comp(body())}},
 on:(a,b)=>{if(a==='open'){tab='files';K.go('computer')}else if(a==='ctab'){tab=b;K.go('computer')}},
 onGo:v=>{st.className='stage '+(v==='home'?'home':['computer','files','devices'].includes(v)?'':'glob');document.getElementById('crumb').innerHTML=`<button data-k="go:home">${I('home',16)}</button><button data-k="go:home">Computers</button>`+(['computer','files','devices'].includes(v)?`${I('chevr',14)}<b>studio-pc</b>`:v!=='home'?`${I('chevr',14)}<b>${v[0].toUpperCase()+v.slice(1)}</b>`:'');document.getElementById('glob').innerHTML=G.map(g=>`<button class="k-navi${v===g[0]?' on':''}" data-k="go:${g[0]}">${I(g[1])}<span>${g[2]}</span>${g[3]?`<em class="k-badge">${g[3]}</em>`:''}</button>`).join('')}});
</script></body></html>
