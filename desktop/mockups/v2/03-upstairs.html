<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Upstairs — the server above, this computer below</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css">
<style>
.d03{--bg:#f5f7fa;--sf:#fff;--rz:#eceff4;--t1:#111827;--t2:#4b5565;--t3:#6b7487;--line:rgba(17,24,39,.08);--line2:rgba(17,24,39,.14);--ac:#2353c6;--ac-ink:#1f4ab0;--ac-soft:rgba(35,83,198,.08);--font:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--r:6px;--rc:10px;--row:32px;
  display:flex;flex-direction:column}
.d03 .top{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 16px;background:var(--sf);border-bottom:1px solid var(--line)}
.d03 .top .brand{font-weight:600;margin-right:16px;display:flex;gap:8px;align-items:center}
.d03 .top .k-navi{height:52px;padding:0 12px;gap:8px;font-size:14px;box-shadow:inset 0 -2px 0 transparent}
.d03 .top .k-navi .i{display:none} .d03 .top .k-navi.on{box-shadow:inset 0 -2px 0 var(--ac);color:var(--t1)}
.d03 .top .k-navi .k-badge{margin-left:2px}
.d03 .top .r{margin-left:auto;display:flex;align-items:center;gap:4px}
.d03 .stage{flex:1;overflow:auto;padding:20px 24px;min-height:0}
.d03 .stage:has(.split){padding:0;overflow:hidden;display:flex}
.d03 .split{flex:1;display:grid;grid-template-rows:1fr auto 260px;min-height:0}
.d03 .pane{display:flex;flex-direction:column;min-height:0;padding:12px 24px 0}
.d03 .pane .k-files{flex:1;min-height:0}
.d03 .lane{display:flex;align-items:center;gap:8px;padding:8px 24px;background:var(--rz);border-block:1px solid var(--line);overflow:hidden}
.d03 .lane>b{font-weight:500;font-size:13px;white-space:nowrap;margin-right:4px}
.d03 .pk{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:var(--r);background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;white-space:nowrap}
.d03 .pk .k-bar{width:72px;margin:0} .d03 .pk small{color:var(--t3);font-family:var(--mono)} .d03 .pk.warn small{color:var(--warn)}
.d03 .lane .sp{flex:1}
.d03 .low{display:grid;grid-template-columns:1fr 280px;gap:24px;padding:12px 24px;min-height:0}
.d03 .low h3,.d03 .pane h3{font:500 13px var(--font);color:var(--t2);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.d03 .loc{overflow:auto}
.d03 .loc .k-lrow{min-height:32px;font-size:13px} .d03 .loc .k-lrow small{margin-left:auto}
.d03 .info{font-size:13px;color:var(--t2)} .d03 .info .k-kv{margin-top:4px}
</style>
<script src="_files.js"></script><script defer src="_nav.js"></script><script src="kit.js"></script></head>
<body class="mk"><div class="win d03">
 <header class="top" id="top"></header>
 <main class="stage" id="st"></main>
</div>
<script>
window.IDEA='The server is upstairs and this computer is downstairs. Files is a vertical split: the server’s folder on top, this computer’s folder below, and between them a lane that shows what is moving and what needs an answer. Uploading is dragging down-to-up; the lane answers conflicts in place.';
window.MAP=[['Navigation','Text tabs in the top bar',1],['Switch computer','Server switcher at the top right (Browse on)',2],['Connect and trust','Browse on menu, New connection',2],['Servers and status','Servers tab; card menus hold Status and the rest',2],['Files and preview','Top half; right-click for every action; images open in the preview',0],['Upload and download','Drag between the halves, or Upload, Ctrl U, Ctrl D',1],['Pair a phone','QR icon in the top bar',1],['Pairing requests','Devices tab shows the count',2],['Transfers','The lane between the halves; Replace, Keep both, Skip answered there',0],['Search','Search tab, or /',1],['Tools','Tools tab',2],['History and audit','History tab',1],['Settings','Settings tab',1],['Tray and notifications','Bell in the top bar',1]];
const I=K.I;
document.getElementById('top').innerHTML=`<span class="brand">${I('key',18)}RFE</span><span id="tabs" style="display:contents"></span><div class="r">${K.C.switcher()}${K.C.actions({no:['refresh']})}</div>`;
const lane=()=>`<div class="lane"><b>Moving</b>${[...K.D.xfer.active,...K.D.xfer.attention.slice(0,1)].map(t=>`<span class="pk${t.st?' warn':''}">${I(t.d==='up'?'up':'chevd',14)}${t.n}${t.st==='conflict'?'<small>name exists</small>'+K.btn('Keep both',{k:'sm ghost'}):t.st?'<small>paused 33%</small>':K.bar(t.pct)+`<small>${t.pct===100?'checking':t.pct+'%'}</small>`}</span>`).join('')}<span class="sp"></span>${K.btn('All transfers',{k:'sm ghost',a:'go:transfers'})}</div>`;
const low=()=>`<div class="low"><div class="loc"><h3>${K.E('laptop',16)}This computer · ~/Downloads <span class="sp"></span>${K.btn('Upload selected',{i:'up',k:'sm',kc:'Ctrl U'})}</h3>${K.D.local.map(l=>`<div class="k-lrow" data-row="${l.n}">${K.fic(l.k)}<span>${l.n}</span><small class="mono">${l.k==='dir'?l.c+' items':l.s}</small></div>`).join('')}</div><div class="info"><h3>Selected on studio-pc</h3>${K.photo(2,280,96,6)}<dl class="k-kv"><dt>Name</dt><dd>north-bed-after.jpg</dd><dt>Size</dt><dd>3.8 MB</dd><dt>Rights</dt><dd class="mono">rw-r--r--</dd></dl><div class="k-row">${K.btn('Download',{i:'download',k:'sm pri',kc:'Ctrl D'})}${K.btn('Share link…',{i:'link',k:'sm',a:'dlg:share'})}</div></div></div>`;
K.mount({stage:document.getElementById('st'),views:{files:()=>`<div class="split"><div class="pane">${K.V.files({panel:false})}</div>${lane()}${low()}</div>`},onGo:v=>{document.getElementById('tabs').innerHTML=K.C.nav(v)}});
</script></body></html>
