<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pocket — lives in the tray, opens as a small window</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css">
<style>
.d16{--bg:#fbfaf7;--sf:#ffffff;--rz:#f1efe9;--t1:#1d1b17;--t2:#5a554b;--t3:#7a7468;--line:rgba(29,27,23,.08);--line2:rgba(29,27,23,.14);--ac:#4d6b2f;--on-ac:#fff;--ac-ink:#44602a;--ac-soft:rgba(77,107,47,.1);--font:"Figtree",system-ui,sans-serif;--row:32px;--fs:13px;position:relative;background:#3a3f38}
.d16 .wall{position:absolute;inset:0}.d16 .wall svg{width:100%;height:100%;display:block}
.d16 .app{position:absolute;left:40px;top:32px;width:820px;height:640px;background:var(--bg);border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.12);display:grid;grid-template-columns:56px 1fr;grid-template-rows:44px 1fr;overflow:hidden}
.d16 .tb{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;border-bottom:1px solid var(--line);background:var(--sf)}
.d16 .tb .k-switch{height:30px}.d16 .tb .k-sbox{flex:1;height:30px}.d16 .tb .k-ib{width:30px;height:30px}
.d16 .tb .wc{display:flex;gap:6px;margin-left:4px}.d16 .tb .wc i{width:12px;height:12px;border-radius:6px;background:var(--rz);box-shadow:inset 0 0 0 1px var(--line2)}
.d16 .rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-right:1px solid var(--line);background:var(--sf)}
.d16 .rail .k-navi{width:40px;height:40px;justify-content:center;position:relative}
.d16 .rail .k-badge{position:absolute;top:2px;right:0;font-size:10px;line-height:14px;min-width:14px;margin:0}
.d16 .stage{overflow:auto;padding:16px;min-height:0}
.d16 .stage:has(.k-files){overflow:hidden;display:flex;flex-direction:column}.d16 .k-files{flex:1}
.d16 .k-frow{grid-template-columns:20px 24px minmax(0,1fr) 72px 104px 32px}.d16 .k-frow .pm,.d16 .k-fhead>:nth-child(6){display:none}
.d16 .bar{position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(24,26,22,.86);display:flex;align-items:center;gap:4px;padding:0 12px;color:#e8e6df;font:12px var(--font)}
.d16 .bar .sp{flex:1}.d16 .bar .ti{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:#e8e6df;position:relative}
.d16 .bar .ti.on{background:rgba(255,255,255,.12)}.d16 .bar .ti i{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:3px;background:#e5484d}
.d16 .pk{position:absolute;right:16px;bottom:56px;width:360px;background:var(--bg);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.12);padding:16px;display:flex;flex-direction:column;gap:12px;font-size:13px}
.d16 .pk h3{display:flex;align-items:center;gap:8px;margin:0;font:500 14px var(--font)}.d16 .pk h3 .sp{flex:1}
.d16 .pk .rq{background:var(--rz);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.d16 .pk .rq b{font:500 18px var(--mono);letter-spacing:.04em}.d16 .pk .rq small{color:var(--t3);grid-column:1/3}
.d16 .pk .rq .acts{grid-column:1/3;display:flex;gap:8px;margin-top:6px}
.d16 .pk .x{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center}.d16 .pk .x small{color:var(--t3);font-family:var(--mono)}
.d16 .pk .x .k-bar{grid-column:2/4;margin:0}
.d16 .pk .dz{border:1px dashed var(--line2);border-radius:10px;height:64px;display:grid;place-items:center;color:var(--t3)}
.d16 .pk .row{display:flex;gap:8px}.d16 .pk .row .k-btn{flex:1;justify-content:center}
.d16 .pk hr{border:0;border-top:1px solid var(--line);margin:0}
</style>
<script src="_files.js"></script><script defer src="_nav.js"></script><script src="kit.js"></script></head>
<body class="mk"><div class="win d16">
 <div class="wall" id="wall"></div>
 <section class="app"><header class="tb" id="tb"></header><nav class="rail" id="rail"></nav><main class="stage" id="st"></main></section>
 <aside class="pk" id="pk"></aside>
 <footer class="bar" id="bar"></footer>
</div>
<script>
window.IDEA='Most days you only need to see that files are moving, answer a phone that wants to pair, or drop a file onto a PC. The tray panel does those three without opening anything; the window is small, sits beside your other work and keeps every page behind its icon rail.';
window.MAP=[['Navigation','Icon rail in the window; tray panel for the everyday three',1],['Switch computer','Switcher in the tray panel or the window',1],['Connect and trust','Servers icon, New connection',2],['Servers and status','Tray panel shows the computer and key; Servers icon for the rest',1],['Files and preview','Window, Files; right-click for every action',1],['Upload and download','Drop onto the tray panel, or Upload in the window',1],['Pair a phone','Tray panel, Pair a phone',2],['Pairing requests','Shown in the tray panel with Accept',1],['Transfers','Tray panel shows progress; Transfers icon for the list',1],['Search','Search box in the window, or /',1],['Tools','Tools icon',1],['History and audit','History icon',1],['Settings','Settings icon; Start with the computer and Close to tray under General',1],['Tray and notifications','The tray icon itself; bell in the window',1]];
const I=K.I,D=K.D;
document.getElementById('wall').innerHTML=K.photo(0,1280,800,0).replace('<svg','<svg preserveAspectRatio="xMidYMid slice"');
document.getElementById('tb').innerHTML=`<span class="wc"><i></i><i></i><i></i></span>${K.C.switcher()}${K.C.searchBox()}${K.ib('qr','Pair a phone','dlg:pairphone')}${K.ib('bell','Notifications','menu:notes','<i class="k-nb"></i>')}<button class="k-av" data-k="menu:account">S</button>`;
document.getElementById('bar').innerHTML=`<span class="ti">${I('grid',18)}</span><span class="ti">${I('folder',18)}</span><span class="ti on">${I('key',18)}</span><span class="sp"></span><span class="ti on" data-k="tray">${I('key',16)}<i></i></span><span class="ti">${I('zap',16)}</span><span style="margin-left:8px;font-family:var(--mono)">10:44</span>`;
document.getElementById('pk').innerHTML=`<h3>${K.dot('ok')}${K.E('server',18)}studio-pc ${K.tag('studio')}<span class="sp"></span>${K.ib('chevd','Change computer','menu:browse')}${K.ib('more','Open RFE, pause all, quit','menu:traymore')}</h3>
<div class="rq"><span>${K.E('phone',16)}Pixel 9 asks to pair</span><b>4829 1307</b><small>Accept only if the phone shows the same code · 1:42 left</small><div class="acts">${K.btn('Accept…',{k:'pri sm',a:'dlg:accept'})}${K.btn('Reject',{k:'sm ghost'})}</div></div>
<div class="x">${I('upload',14)}<span>walkthrough-full.mov</span><small>71% · 23 s</small>${K.bar(71)}</div>
<div class="x">${K.E('warning',16)}<span>bed-layout.pdf exists on work-laptop</span>${K.btn('Keep both',{k:'sm'})}</div>
<div class="dz">${I('upload',16)} Drop files to send to studio-pc · Inbox</div>
<hr><div class="row">${K.btn('Open RFE',{k:'sm',a:'go:files'})}</div>`;
K.MENU.traymore=[['Open RFE','go:files','grid'],['Pause all transfers','toast:Paused 2 transfers','pause'],['Pair a phone…','dlg:pairphone','qr'],'-',['Quit RFE','toast:Quitting stops transfers; the agent keeps running','power']];
K.mount({stage:document.getElementById('st'),views:{files:()=>K.V.files({panel:false})},on:a=>{if(a==='tray'){const p=document.getElementById('pk');p.style.display=p.style.display==='none'?'':'none';}},onGo:v=>{document.getElementById('rail').innerHTML=K.C.nav(v,{icons:1});}});
</script></body></html>
