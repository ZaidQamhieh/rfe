<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Console — type what you want, keys for everything</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css">
<style>
.d06{--bg:#141415;--sf:#19191b;--rz:#232325;--t1:#ededed;--t2:#a1a1a6;--t3:#85858b;--line:rgba(237,237,237,.08);--line2:rgba(237,237,237,.14);--ac:#e0a43b;--on-ac:#141415;--ac-ink:#e0a43b;--ac-soft:rgba(224,164,59,.12);--pos:#4cc38a;--neg:#e5484d;--warn:#e0a43b;--font:"Geist",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--row:32px;--fs:13px;--shadow:0 12px 32px rgba(0,0,0,.45);display:flex;flex-direction:column}
.d06 .k-chip.on{background:#ededed;color:#141415}.d06 .k-qr{background:#ededed}
.d06 .keys{height:40px;flex:none;display:flex;align-items:center;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--t3)}
.d06 .keys button{display:flex;gap:6px;align-items:center;height:28px;padding:0 8px;border-radius:6px;color:var(--t2)}
.d06 .keys button:hover,.d06 .keys button.on{background:var(--rz);color:var(--t1)}
.d06 .keys kbd{background:#0f0f10}
.d06 .keys .r{margin-left:auto;display:flex;gap:4px;align-items:center}
.d06 .stage{flex:1;overflow:auto;padding:16px 20px;min-height:0;position:relative}
.d06 .stage:has(.k-files){overflow:hidden;display:flex;flex-direction:column}.d06 .k-files{flex:1}
.d06 .cmd{flex:none;border-top:1px solid var(--line);background:#0f0f10;position:relative}
.d06 .sugg{position:absolute;left:16px;bottom:100%;margin-bottom:8px;width:560px;background:var(--sf);border-radius:12px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line2);padding:4px;z-index:30}
.d06 .sugg button{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;width:100%;height:36px;padding:0 8px;border-radius:8px;color:var(--t2);text-align:left}
.d06 .sugg button.on{background:var(--rz);color:var(--t1)} .d06 .sugg small{color:var(--t3);font-family:var(--mono)}
.d06 .sugg h4{margin:8px 8px 4px;font:500 12px var(--font);color:var(--t3)}
.d06 .line{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;font:14px var(--mono)}
.d06 .line .p{color:var(--t3)} .d06 .line .p b{color:var(--ac);font-weight:500}
.d06 .line input{flex:1;background:none;border:0;outline:0;color:var(--t1);font:inherit}
.d06 .mode{display:flex;align-items:center;gap:16px;height:28px;padding:0 16px;font:12px var(--mono);color:var(--t3);border-top:1px solid var(--line)}
.d06 .mode .m{background:var(--ac);color:#141415;padding:2px 8px;border-radius:4px}
.d06 .mode .warn{color:var(--ac)}
</style>
<script src="_files.js"></script><script defer src="_nav.js"></script><script src="kit.js"></script></head>
<body class="mk"><div class="win d06">
 <div class="keys" id="keys"></div>
 <main class="stage" id="st"></main>
 <div class="cmd"><div class="sugg" id="sugg"></div><div class="line"><span class="p">studio-pc:<b>~/Projects/garden-plan</b> ›</span><input value="send north-bed" aria-label="Command"><kbd>Enter</kbd></div><div class="mode" id="mode"></div></div>
</div>
<script>
window.IDEA='For people who live on the keyboard. A command line sits at the bottom and understands every action of the app (send, get, share, pair, accept, revoke, trust, status…), suggesting files and computers as you type. Pages are two keystrokes away and listed at the top so nobody has to remember them.';
window.MAP=[['Navigation','g then a letter (g f, g s, g d…), or click the key strip at the top',2],['Switch computer','Type "on work-laptop", or click the computer in the mode line',1],['Connect and trust','"connect 192.168.1.44" opens the trust dialog',1],['Servers and status','g s, or "status studio-pc"',2],['Files and preview','Default page; Enter previews; every file action is a command and a right-click',0],['Upload and download','"send <file>", "get <file>", Ctrl U, Ctrl D, or drag',1],['Pair a phone','"pair" or the QR key',1],['Pairing requests','The mode line shows the request; "accept" asks once more',1],['Transfers','Mode line shows progress; g t for the page',2],['Search','/ searches every connected computer',1],['Tools','g o, then the tab',2],['History and audit','g h',2],['Settings',', (comma)',1],['Tray and notifications','Bell at the right of the key strip',1]];
const I=K.I;
const KEYS=[['files','g f','Files'],['servers','g s','Servers'],['devices','g d','Devices 2'],['transfers','g t','Transfers 3'],['search','/','Search'],['tools','g o','Tools'],['history','g h','History'],['settings',',','Settings']];
function keys(v){document.getElementById('keys').innerHTML=KEYS.map(k=>`<button class="${v===k[0]?'on':''}" data-k="go:${k[0]}">${k[1].split(' ').map(x=>`<kbd>${x}</kbd>`).join('')}${k[2]}</button>`).join('')+`<div class="r">${K.C.actions({no:['refresh']})}</div>`;}
document.getElementById('sugg').innerHTML=`<h4>Send to studio-pc</h4>`+[['upload','send north-bed-after.jpg','to work-laptop · 3.8 MB',1],['upload','send north-bed-before.jpg','to work-laptop · 4.1 MB'],['download','get north-bed-after.jpg','to ~/Downloads/RFE Desktop'],['link','share north-bed-after.jpg','link for 1 hour']].map(s=>`<button class="${s[3]?'on':''}" data-k="toast:Copying north-bed-after.jpg: download, then upload to work-laptop">${I(s[0])}<span>${s[1]}</span><small>${s[2]}</small></button>`).join('')+`<h4>Also</h4><button data-k="dlg:pairphone">${I('qr')}<span>pair</span><small>code and QR for a phone</small></button><button data-k="dlg:accept">${I('check')}<span>accept Pixel 9</span><small>match 4829 1307</small></button>`;
document.getElementById('mode').innerHTML=`<span class="m">NORMAL</span><span data-k="menu:browse" style="cursor:pointer">${K.dot('ok')} studio-pc 12 ms LAN</span>${K.tag('studio')}<span>↑ 71% walkthrough-full.mov · 52.4 MB/s</span><span class="warn" data-k="go:transfers" style="cursor:pointer">3 need you</span><span class="warn" data-k="go:devices" style="cursor:pointer">Pixel 9 asks to pair</span><span class="sp" style="flex:1"></span><span>? for every key</span>`;
K.mount({stage:document.getElementById('st'),onGo:keys});
</script></body></html>
