<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Workspaces — tabs for places and pages, two side by side</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css">
<style>
.d09{--bg:#161513;--sf:#1c1a18;--rz:#262421;--t1:#efe9de;--t2:#aaa398;--t3:#8a847a;--line:rgba(239,233,222,.08);--line2:rgba(239,233,222,.14);--ac:#e2725b;--on-ac:#161513;--ac-ink:#ec8b77;--ac-soft:rgba(226,114,91,.12);--pos:#4cc38a;--neg:#e5484d;--warn:#e0a43b;--font:"Instrument Sans",system-ui,sans-serif;--shadow:0 12px 32px rgba(0,0,0,.45);display:flex;flex-direction:column}
.d09 .k-btn.pri{background:#efe9de;color:#161513}.d09 .k-chip.on{background:#efe9de;color:#161513}.d09 .k-qr{background:#efe9de}
.d09 .tabs{height:44px;flex:none;display:flex;align-items:flex-end;gap:2px;padding:0 8px;background:#12110f}
.d09 .tab{height:36px;width:200px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:10px 10px 0 0;color:var(--t2);font-size:13px;white-space:nowrap;overflow:hidden}
.d09 .tab:hover{background:var(--sf)} .d09 .tab.on{background:var(--bg);color:var(--t1)}
.d09 .tab span{overflow:hidden;text-overflow:ellipsis;flex:1} .d09 .tab .x{opacity:.6}
.d09 .tabs .new{align-self:center;margin-left:4px}
.d09 .omni{height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid var(--line)}
.d09 .addr{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:var(--rz);font:13px var(--mono);color:var(--t2)}
.d09 .addr b{color:var(--t1);font-weight:400} .d09 .addr .lk{color:var(--pos);display:flex;gap:4px;align-items:center;font-family:var(--font)}
.d09 .marks{height:34px;flex:none;display:flex;align-items:center;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);font-size:12px}
.d09 .marks button{height:26px;padding:0 10px;border-radius:13px;display:flex;gap:6px;align-items:center;color:var(--t2)}
.d09 .marks button:hover{background:var(--rz);color:var(--t1)}
.d09 .stage{flex:1;overflow:auto;padding:20px 24px;min-height:0}
.d09 .stage:has(.split){overflow:hidden;display:flex;padding:0}
.d09 .split{flex:1;display:grid;grid-template-columns:1.4fr 1fr;min-height:0}
.d09 .split>div{padding:16px 20px;display:flex;flex-direction:column;min-height:0;min-width:0}
.d09 .split>div+div{border-left:1px solid var(--line)}
.d09 .split .k-files{flex:1;min-height:0}
.d09 .split h3{font:500 13px var(--font);color:var(--t2);margin:0 0 12px;display:flex;gap:8px;align-items:center}
.d09 .split .k-frow,.d09 .split .k-fhead{grid-template-columns:20px 24px minmax(0,1fr) 84px 108px 32px}.d09 .split .k-frow .pm,.d09 .split .k-fhead>:nth-child(6){display:none}
.d09 .tab{width:220px}
.d09 .k-dockwrap{position:absolute;right:16px;top:100px;width:520px;display:none;z-index:40}.d09 .k-dockwrap.open{display:block}
</style>
<script src="_files.js"></script><script defer src="_nav.js"></script><script src="kit.js"></script></head>
<body class="mk"><div class="win d09">
 <div class="tabs" id="tabs"></div>
 <div class="omni" id="omni"></div>
 <div class="marks" id="marks"></div>
 <main class="stage" id="st"></main>
 <div class="k-dockwrap" id="dock"></div>
</div>
<script>
window.IDEA='Every place and every page is a tab, like a browser. A tab can be split to put two folders side by side, on two computers or on this one. The address bar takes an rfe:// path or a search. Favorites, Trash, links and apps are bookmarks; transfers sit where a browser keeps downloads.';
window.MAP=[['Navigation','Tabs; Ctrl T opens a page or place; the ⋮ menu lists every page',1],['Switch computer','Open a tab on it, or type rfe://work-laptop',1],['Connect and trust','New tab, New connection',2],['Servers and status','Servers tab; card menus',2],['Files and preview','Any folder tab; split view; right-click for every action',0],['Upload and download','Drag between the split halves, or Upload, Ctrl U, Ctrl D',1],['Pair a phone','QR icon beside the address bar',1],['Pairing requests','Devices tab, kept open with its count',1],['Transfers','Ring beside the address bar opens the list, like downloads',1],['Search','Type in the address bar',1],['Tools','Bookmarks for Favorites, Trash, Share links, Apps; Tools tab for the rest',1],['History and audit','History in the ⋮ menu or as a tab',2],['Settings','⋮ menu, Settings',2],['Tray and notifications','Bell beside the address bar',1]];
const I=K.I;
const TABS=[['files','dir','garden-plan'],['files2','dir','Documents · work-laptop'],['devices','phone','Devices  2'],['transfers','updown_arrow','Transfers']];
function tabs(v){document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="tab${(v===t[0])?' on':''}" data-k="go:${t[0]==='files2'?'files':t[0]}">${K.E(t[1],16)}<span>${t[2]}</span><span class="x">${I('x',12)}</span></button>`).join('')+K.ib('plus','New tab (Ctrl T)','dlg:palette').replace('k-ib','k-ib new');
 const a=v==='files'?`rfe://studio-pc<b>/home/sam/Projects/garden-plan</b>`:`rfe://${v}`;
 document.getElementById('omni').innerHTML=`${K.ib('left','Back (Alt+Left)')}${K.ib('up','Up one folder (Alt+Up)')}<div class="addr"><span class="lk">${I('lock',12)}pinned</span>${a}<span class="sp" style="flex:1"></span>${I('star',14)}</div><button class="k-xpill" data-k="dock" style="height:32px">${K.C.ring(71)}2</button>${K.C.actions({no:['refresh']}).replace('</button><button class="k-av"','</button>'+K.ib('more','Every page','menu:pages')+'<button class="k-av"')}`;}
document.getElementById('marks').innerHTML=K.D.favs.map(f=>`<button data-k="go:files">${K.E('dir',14)}${f[0]}</button>`).join('')+`<button data-k="tool:trash">${K.E('wastebasket',14)}Trash</button><button data-k="tool:share">${K.E('link',14)}Share links</button><button data-k="tool:apps">${K.E('toolbox',14)}Apps on studio-pc</button><button data-k="tool:fav">${K.E('inbox_tray',14)}Offline</button>`;
document.getElementById('dock').innerHTML=K.C.dock();
K.MENU.pages=K.C.navItems.map(n=>[n[2],'go:'+n[0],n[1]]).concat(['-',['New connection','dlg:newconn','plug']]);
const files=()=>`<div class="split"><div><h3>${K.dot('ok')}studio-pc ${K.tag('studio')}</h3>${K.V.files({panel:false,notools:false})}</div><div><h3>${K.E('laptop',16)}This computer · ~/Downloads <span class="sp" style="flex:1"></span>${K.ib('x','Close split')}</h3><div class="k-list">${K.D.local.map(l=>`<div class="k-lrow" data-row="${l.n}">${K.fic(l.k)}<span>${l.n}</span><small class="mono">${l.k==='dir'?l.c+' items':l.s}</small></div>`).join('')}</div><div class="k-drop">${I('transfer')}<span>Drag across the split to copy between the two</span></div></div></div>`;
K.mount({stage:document.getElementById('st'),views:{files},onGo:tabs});
</script></body></html>
