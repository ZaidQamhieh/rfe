<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Launcher — one field finds files on the left and offers actions on the right</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="base.css">
<style>

.d07{--bg:#0f1420;--sf:#151b29;--rz:#1e2636;--t1:#e7ebf3;--t2:#a2abbd;--t3:#7e889b;--line:rgba(231,235,243,.08);--line2:rgba(231,235,243,.14);--ac:#7aa2f7;--on-ac:#0f1420;--ac-ink:#9ab8fa;--ac-soft:rgba(122,162,247,.13);--pos:#5cc48d;--neg:#ef6b73;--warn:#e7b45c;--font:"Inter Tight",system-ui,sans-serif;--mono:"JetBrains Mono",monospace;--shadow:0 20px 50px rgba(0,0,0,.5)}
.d07 .k-btn.pri{background:var(--ac);color:#0f1420;box-shadow:none}.d07 .k-qr{background:#e7ebf3}
.d07 .top{height:54px;flex:none;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid var(--line)}.d07 .top .b-st{margin-right:auto}
.d07 .b-sr{background:rgba(5,8,14,.6)}
.d07 .b-sr .m{left:calc(50% + 120px);top:70px;transform:translateX(-50%);width:860px;background:var(--sf);border-radius:14px;box-shadow:var(--shadow),0 0 0 1px var(--line2);overflow:hidden}
.d07 .qf{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);color:var(--t3)}.d07 .qf input{flex:1;border:0;outline:0;background:none;font:19px var(--font);color:var(--t1)}
.d07 .qc{display:grid;grid-template-columns:1fr 320px;min-height:360px}
.d07 .qc>div{padding:10px}.d07 .qc>div+div{border-left:1px solid var(--line);background:rgba(0,0,0,.12)}
.d07 h4{font:500 11px var(--font);color:var(--t3);margin:8px 10px 6px;letter-spacing:.03em}
.d07 .qi{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;text-align:left;color:var(--t1)}.d07 .qi:hover,.d07 .qi.on{background:var(--rz)}.d07 .qi.on{box-shadow:inset 0 0 0 1px var(--line2)}
.d07 .qi small{display:block;color:var(--t3);font:11px var(--mono)}.d07 .qi .k-ic{color:var(--t2)}
.d07 .qb{display:flex;gap:16px;padding:10px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--t3)}.d07 .qb .sp{flex:1}
.d07 .qn{padding:40px 16px;display:grid;gap:8px;justify-items:start;color:var(--t2);font-size:13px}.d07 .qn b{color:var(--t1);font-size:15px;font-weight:500}

</style>
<script src="_files.js"></script><script src="_nav.js"></script><script src="kit.js"></script><script src="base.js"></script></head>
<body class="mk"><div class="win rfe d07">
 <aside class="side" id="side"></aside>
 <div class="main"><header class="top" id="top"></header><div class="body"><main class="stage" id="st"></main><aside class="rail" id="rail"></aside></div><footer class="bot" id="bot"></footer></div>
 <div class="k-dockwrap" id="dock"></div><div class="pop" id="pop"></div>
</div>
<script>
window.IDEA="One field for both questions: where is it, and what do I do. Files it found are on the left, the actions that fit them and the app\u2019s common jobs on the right, each with its key. Nothing is mixed into one long list.";
window.MAP=[["Navigation", "Left sidebar (fixed): Overview, the pages, Computers, Add a computer", 1], ["Files", "Files page (fixed): one tree across every computer, actions on the row", 1], ["Overview, Servers, Devices, Transfers, Tools, History, Settings", "Fixed pages; lists open their details in the inspector on the right", 1], ["Search", "Search or do in the top bar, Ctrl K, / or the sidebar", 1], ["Actions", "Right column: actions for the found files, then common jobs", 2], ["Keys", "Each row shows its key; Tab moves between the columns", 2]];
const I=K.I,D=K.D,E=K.E,EM=B.empty,S=B.S,hl=B.hl,sk=B.sk;

document.getElementById('top').innerHTML=`<button class="b-st" data-k="go:search">${I('search',16)}Search or do${sk('Ctrl K')}</button>`+K.C.actions();
const act=(ic,t,k,a='',on='')=>`<button class="qi ${on}" ${a?`data-k="${a}"`:''}>${I(ic,16)}<span>${t}</span>${k?sk(k):''}</button>`;
const search=()=>`<div class="m" role="dialog" aria-label="Search or do"><label class="qf">${I('search',20)}<input value="${S.q}" placeholder="${EM?'Type a file name, or what you want to do':'File name or an action'}" aria-label="Search or do">${sk('Esc')}</label>
<div class="qc"><div>${EM?`<h4>Files</h4><div class="qn">${E('magnifying_glass_tilted_left',36)}<b>No files to find yet</b>Add a computer and its files show up here as you type. The actions on the right work now.</div>`:`<h4>Files · 6</h4>${S.res.map((r,i)=>`<div class="qi${i?'':' on'}" data-k="sr:go:files">${K.fic(r.k)}<span>${hl(r.n)}<small>${r.pc} · ${r.path}</small></span><small>${r.size}</small></div>`).join('')}`}</div>
<div>${EM?`<h4>Do</h4>${act('plus','Add a computer','Enter','dlg:newconn','on')}${act('radar','Find computers on this network','','dlg:newconn:Find on network')}${act('sliders','Open Settings','Ctrl ,','sr:go:settings')}${act('info','Show the welcome tour','','dlg:welcome')}`:`<h4>For north-bed-after.jpg</h4>${act('folder','Open in Files','Enter','sr:go:files')}${act('download','Download','Ctrl D')}${act('link','Share link…','Ctrl L','dlg:share')}${act('eye','Preview','Space','dlg:preview')}<h4>Do</h4>${act('qr','Pair a phone','','dlg:pairphone')}${act('pause','Pause all transfers','')}${act('plus','Add a computer','','dlg:newconn')}`}</div></div>
<div class="qb"><span>${sk('↑')} ${sk('↓')} move</span><span>${sk('Tab')} files ⇄ actions</span><span class="sp"></span><span>${EM?'Searches this computer’s Downloads':'media-mini offline, not searched'}</span></div></div>`;
B.mount({search});

</script></body></html>
