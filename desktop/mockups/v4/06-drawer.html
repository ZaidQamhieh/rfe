<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Drawer — search slides in from the right, results grouped by folder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="base.css">
<style>

.d06{--bg:#f6f6f1;--sf:#fff;--rz:#ecece4;--t1:#1d2016;--t2:#4f5446;--t3:#6e7363;--line:rgba(29,32,22,.08);--line2:rgba(29,32,22,.15);--ac:#4d6b1f;--ac-ink:#435e1a;--ac-soft:rgba(77,107,31,.09);--font:"Figtree",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
.d06 .top{height:54px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 20px;border-bottom:1px solid var(--line)}
.d06 .b-sr{background:rgba(29,32,22,.14)}
.d06 .b-sr .m{right:0;top:0;bottom:0;width:460px;background:var(--sf);box-shadow:-16px 0 40px rgba(29,32,22,.14),-1px 0 0 var(--line2);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.d06 .qf{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}.d06 .qf label{flex:1;display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--ac),0 0 0 3px var(--ac-soft);color:var(--t3)}.d06 .qf input{flex:1;border:0;outline:0;background:none;font:16px var(--font);color:var(--t1)}
.d06 .qw{padding:0 20px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}.d06 .qw p{margin:0;font-size:12px;color:var(--t3)}
.d06 .qw .qp{display:flex;flex-wrap:wrap;gap:6px}.d06 .qw .qp button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;color:var(--t2);box-shadow:inset 0 0 0 1px var(--line2)}.d06 .qw .qp button.on{background:var(--ac-soft);color:var(--ac-ink);box-shadow:inset 0 0 0 1px var(--ac)}.d06 .qw .qp button:disabled{opacity:.55}
.d06 .qg{overflow:auto;padding:8px 12px}
.d06 .qh{display:flex;align-items:center;gap:8px;padding:12px 8px 6px;font-size:13px;font-weight:500}.d06 .qh small{font:11px var(--mono);color:var(--t3);font-weight:400}.d06 .qh .k-btn{margin-left:auto;height:26px}
.d06 .qi{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 8px 7px 30px;border-radius:7px;font-size:13px;cursor:pointer}.d06 .qi:hover{background:var(--rz)}.d06 .qi small{font:11px var(--mono);color:var(--t3)}
.d06 .qb{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--t3)}.d06 .qb .sp{flex:1}
.d06 .qn{display:grid;gap:10px;padding:28px 20px;color:var(--t2);font-size:13px;justify-items:start}.d06 .qn b{color:var(--t1);font-size:15px;font-weight:500}.d06 .qn p{margin:0}

</style>
<script src="_files.js"></script><script src="_nav.js"></script><script src="kit.js"></script><script src="base.js"></script></head>
<body class="mk"><div class="win rfe d06">
 <aside class="side" id="side"></aside>
 <div class="main"><header class="top" id="top"></header><div class="body"><main class="stage" id="st"></main><aside class="rail" id="rail"></aside></div><footer class="bot" id="bot"></footer></div>
 <div class="k-dockwrap" id="dock"></div><div class="pop" id="pop"></div>
</div>
<script>
window.IDEA="Search is a drawer on the right, where details live on every other page, so the page you were on stays in view. It says which computers it searched and groups what it found by folder, because a folder is usually what you were after.";
window.MAP=[["Navigation", "Left sidebar (fixed): Overview, the pages, Computers, Add a computer", 1], ["Files", "Files page (fixed): one tree across every computer, actions on the row", 1], ["Overview, Servers, Devices, Transfers, Tools, History, Settings", "Fixed pages; lists open their details in the inspector on the right", 1], ["Search", "Find files in the top bar, Ctrl K, / or the sidebar", 1], ["Which computers", "The line under the field; each computer can be switched off", 2], ["By folder", "Results grouped by folder; Open folder on each group", 2]];
const I=K.I,D=K.D,E=K.E,EM=B.empty,S=B.S,hl=B.hl,sk=B.sk;

document.getElementById('top').innerHTML=`<button class="b-st" data-k="go:search">${I('search',16)}Find files${sk('Ctrl K')}</button>`+K.C.actions();
const groups=[['garden-plan','studio-pc','/home/sam/Projects',['north-bed-after.jpg','north-bed-before.jpg','bed-layout.pdf']],['Garden','work-laptop','/Users/sam/Documents',['bed-layout-v2.pdf']],['2025','studio-pc','/home/sam/Photos',['raised-beds']],['Desktop','work-laptop','/Users/sam',['bedroom-paint.txt']]];
const R=n=>S.res.find(r=>r.n===n);
const search=()=>`<div class="m" role="dialog" aria-label="Search"><div class="qf"><label>${I('search',18)}<input value="${S.q}" placeholder="File or folder name" aria-label="Search"></label>${K.ib('x','Close (Esc)','sr:close')}</div>
<div class="qw"><p>${EM?'Searching this computer’s Downloads':'Searching 2 of 4 computers'}</p><div class="qp">${EM?'<button class="on">This computer</button>':D.servers.map(s=>`<button class="${s.dot==='ok'?'on':''}" data-k="sr:pick" data-multi${s.dot==='ok'?'':' disabled'}>${K.dot(s.dot)}${s.name}${s.dot==='ok'?'':`<small>· ${s.dot==='bad'?'not trusted':'offline'}</small>`}</button>`).join('')}</div></div>
<div class="qg">${EM?`<div class="qn">${E('file_folder',36)}<b>No computers to look in</b><p>Search finds files by name on every computer you add, and groups them by the folder they sit in.</p>${K.btn('Add a computer',{i:'plus',k:'pri',a:'dlg:newconn'})}</div>`:groups.map(g=>`<div class="qh">${E('file_folder',16)}${g[0]}<small>${g[1]} · ${g[2]}</small>${K.btn('Open folder',{k:'sm ghost',a:'sr:go:files'})}</div>${g[3].map(n=>{const r=R(n);return `<div class="qi" data-k="sr:go:files">${K.fic(r.k)}<span>${hl(r.n)}</span><small>${r.size}</small></div>`}).join('')}`).join('')}</div>
<div class="qb">${EM?'<span>Esc closes</span>':'<span>6 files in 4 folders</span><span class="sp"></span>'+K.btn('Show all in Files',{k:'sm',a:'sr:go:files'})}</div></div>`;
B.mount({search});

</script></body></html>
