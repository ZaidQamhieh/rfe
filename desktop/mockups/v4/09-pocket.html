<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pocket — search opens beside the sidebar, from the Search item itself</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="base.css">
<style>

.d09{--bg:#f3f6f5;--sf:#fff;--rz:#e6eceb;--t1:#122120;--t2:#425654;--t3:#627573;--line:rgba(18,33,32,.08);--line2:rgba(18,33,32,.15);--ac:#00756a;--ac-ink:#00685e;--ac-soft:rgba(0,117,106,.09);--font:"Karla",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
.d09 .top{height:52px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 20px;border-bottom:1px solid var(--line)}
.d09.sr-open .side [data-k="go:search"]{background:var(--ac-soft);color:var(--ac-ink)}
.d09 .b-sr{left:240px;background:rgba(18,33,32,.12)}
.d09 .b-sr .m{left:0;top:0;bottom:0;width:420px;background:var(--sf);box-shadow:16px 0 40px rgba(18,33,32,.12),1px 0 0 var(--line2);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.d09 .qf{display:flex;align-items:center;gap:10px;margin:14px 16px 10px;height:40px;padding:0 12px;border-radius:10px;background:var(--rz);color:var(--t3)}.d09 .qf input{flex:1;border:0;outline:0;background:none;font:16px var(--font);color:var(--t1)}
.d09 .qs{padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
.d09 .qs button{display:inline-flex;gap:6px;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;color:var(--t2);background:var(--rz)}
.d09 .qs small{width:100%;font-size:11px;color:var(--t3)}
.d09 .ql{overflow:auto;padding:6px 8px}.d09 h4{font:600 12px var(--font);color:var(--t3);margin:10px 8px 4px}
.d09 .qi{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;padding:8px;border-radius:8px;font-size:14px;cursor:pointer}.d09 .qi:hover,.d09 .qi.on{background:var(--rz)}.d09 .qi small{display:block;font:11px var(--mono);color:var(--t3)}
.d09 .qb{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--t3)}
.d09 .qn{display:grid;gap:10px;justify-items:start;padding:24px 8px;color:var(--t2);font-size:14px}.d09 .qn b{color:var(--t1);font-weight:600}.d09 .qn p{margin:0}

</style>
<script src="_files.js"></script><script src="_nav.js"></script><script src="kit.js"></script><script src="base.js"></script></head>
<body class="mk"><div class="win rfe d09">
 <aside class="side" id="side"></aside>
 <div class="main"><header class="top" id="top"></header><div class="body"><main class="stage" id="st"></main><aside class="rail" id="rail"></aside></div><footer class="bot" id="bot"></footer></div>
 <div class="k-dockwrap" id="dock"></div><div class="pop" id="pop"></div>
</div>
<script>
window.IDEA="Search lives where you click it: it opens as a panel beside the sidebar, next to the Search item, and the page stays visible on the right. Recent and saved searches wait above the field until you type.";
window.MAP=[["Navigation", "Left sidebar (fixed): Overview, the pages, Computers, Add a computer", 1], ["Files", "Files page (fixed): one tree across every computer, actions on the row", 1], ["Overview, Servers, Devices, Transfers, Tools, History, Settings", "Fixed pages; lists open their details in the inspector on the right", 1], ["Search", "Search in the sidebar, Ctrl K or /", 1], ["Recent and saved", "Above the results; one click repeats one", 2], ["Open a result", "Click: it opens in Files and the panel closes", 2]];
const I=K.I,D=K.D,E=K.E,EM=B.empty,S=B.S,hl=B.hl,sk=B.sk;

document.getElementById('top').innerHTML=K.C.actions();
const search=()=>`<div class="m" role="dialog" aria-label="Search"><label class="qf">${I('search',18)}<input value="${S.q}" placeholder="Search your computers" aria-label="Search">${sk('Esc')}</label>
<div class="qs">${EM?'<small>Recent and saved searches appear here.</small>':`<small>Saved and recent</small>${S.saved.map(x=>`<button>${E('star',12)}${x}</button>`).join('')}${S.recent.map(x=>`<button>${I('history',12)}${x}</button>`).join('')}`}</div>
<div class="ql">${EM?`<div class="qn">${E('mobile_phone_with_arrow',36)}<b>Add a computer to search it</b><p>Until then, search looks in this computer’s Downloads folder.</p>${K.btn('Add a computer',{i:'plus',k:'pri',a:'dlg:newconn'})}</div>`:['studio-pc','work-laptop'].map(pc=>`<h4>${pc}</h4>${S.res.filter(r=>r.pc===pc).map((r,i)=>`<div class="qi${pc==='studio-pc'&&!i?' on':''}" data-k="sr:go:files">${K.fic(r.k)}<span>${hl(r.n)}<small>${r.path} · ${r.size}</small></span></div>`).join('')}`).join('')}</div>
<div class="qb">${EM?'<span>Ctrl K opens this from anywhere</span>':'<span>6 found · media-mini offline</span>'}</div></div>`;
B.mount({search});

</script></body></html>
