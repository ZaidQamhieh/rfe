<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dock — a search pill at the foot of every page that opens upward</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="base.css">
<style>

.d10{--bg:#16130f;--sf:#1e1a15;--rz:#2a251e;--t1:#f1ebe2;--t2:#b3a99b;--t3:#8f8577;--line:rgba(241,235,226,.08);--line2:rgba(241,235,226,.14);--ac:#9ccf6a;--on-ac:#16130f;--ac-ink:#b2dc88;--ac-soft:rgba(156,207,106,.12);--pos:#9ccf6a;--neg:#ec6a5a;--warn:#e8b45a;--font:"Bricolage Grotesque",system-ui,sans-serif;--mono:"JetBrains Mono",monospace;--shadow:0 20px 50px rgba(0,0,0,.55)}
.d10 .k-btn.pri{background:var(--ac);color:#16130f;box-shadow:none}.d10 .k-qr{background:#f1ebe2}
.d10 .top{height:52px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 20px;border-bottom:1px solid var(--line)}
.d10 .stage{padding-bottom:72px}
.d10 #pop{left:calc(50% + 120px);bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 14px;border-radius:20px;background:var(--rz);box-shadow:var(--shadow),inset 0 0 0 1px var(--line2);color:var(--t2);font-size:13px;cursor:pointer;z-index:20}
.d10 #pop:hover{color:var(--t1)}.d10.sr-open #pop{display:none}
.d10 .b-sr{background:rgba(0,0,0,.45)}
.d10 .b-sr .m{left:calc(50% + 120px);bottom:18px;transform:translateX(-50%);width:680px;background:var(--sf);border-radius:18px;box-shadow:var(--shadow),0 0 0 1px var(--line2);overflow:hidden;display:flex;flex-direction:column}
.d10 .ql{max-height:430px;overflow:auto;padding:10px}.d10 h4{font:500 12px var(--font);color:var(--t3);margin:8px 10px 4px}
.d10 .qi{display:grid;grid-template-columns:22px 1fr auto auto;gap:12px;align-items:center;padding:9px 10px;border-radius:10px;font-size:14px;cursor:pointer}.d10 .qi:hover,.d10 .qi.on{background:var(--rz)}.d10 .qi small{font:11px var(--mono);color:var(--t3)}.d10 .qi .qpc{font:11px var(--mono);color:var(--t2)}
.d10 .qf{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-top:1px solid var(--line);color:var(--t3)}.d10 .qf input{flex:1;border:0;outline:0;background:none;font:17px var(--font);color:var(--t1)}
.d10 .qf .k-seg{flex:none}
.d10 .qn{display:flex;gap:14px;align-items:center;padding:20px 12px;color:var(--t2);font-size:14px}.d10 .qn p{margin:0;flex:1}.d10 .qn b{display:block;color:var(--t1);font-weight:500}

</style>
<script src="_files.js"></script><script src="_nav.js"></script><script src="kit.js"></script><script src="base.js"></script></head>
<body class="mk"><div class="win rfe d10">
 <aside class="side" id="side"></aside>
 <div class="main"><header class="top" id="top"></header><div class="body"><main class="stage" id="st"></main><aside class="rail" id="rail"></aside></div><footer class="bot" id="bot"></footer></div>
 <div class="k-dockwrap" id="dock"></div><div class="pop" id="pop"></div>
</div>
<script>
window.IDEA="No search in the top bar at all: a small pill sits at the foot of every page, where your eyes land after reading. It opens upward into results, with the scope switch beside the field, and closes back into the pill.";
window.MAP=[["Navigation", "Left sidebar (fixed): Overview, the pages, Computers, Add a computer", 1], ["Files", "Files page (fixed): one tree across every computer, actions on the row", 1], ["Overview, Servers, Devices, Transfers, Tools, History, Settings", "Fixed pages; lists open their details in the inspector on the right", 1], ["Search", "The pill at the foot of every page, Ctrl K, / or the sidebar", 1], ["Scope", "Switch beside the field: all computers, one, this computer", 2], ["Open a result", "Click a row: it opens in Files", 2]];
const I=K.I,D=K.D,E=K.E,EM=B.empty,S=B.S,hl=B.hl,sk=B.sk;

document.getElementById('top').innerHTML=K.C.actions();
const pill=document.getElementById('pop');pill.dataset.k='go:search';pill.innerHTML=`${I('search',16)}<span>Search your computers</span>${sk('/')}`;
const search=()=>`<div class="m" role="dialog" aria-label="Search"><div class="ql">${EM?`<div class="qn">${E('magnifying_glass_tilted_left',36)}<p><b>Nothing to search yet</b>Search covers every computer you add, and this computer’s Downloads.</p>${K.btn('Add a computer',{i:'plus',k:'pri',a:'dlg:newconn'})}</div>`:`<h4>Recent</h4>${S.recent.slice(0,2).map(x=>`<div class="qi">${I('history',16)}<span>${x}</span><span></span><span></span></div>`).join('')}<h4>Found · 6</h4>${S.res.map((r,i)=>`<div class="qi${i?'':' on'}" data-k="sr:go:files">${K.fic(r.k)}<span>${hl(r.n)} <small>${r.path}</small></span><span class="qpc">${r.pc}</span><small>${r.size}</small></div>`).join('')}`}</div>
<label class="qf">${I('search',18)}<input value="${S.q}" placeholder="Search your computers" aria-label="Search">${EM?K.seg(['This computer'],'This computer'):K.seg(['All','studio-pc','work-laptop','This computer'],'All')}</label></div>`;
B.mount({search});

</script></body></html>
