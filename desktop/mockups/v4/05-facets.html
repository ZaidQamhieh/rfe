<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Facets — a wide sheet: filters with counts, results, saved searches</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="base.css">
<style>

.d05{--bg:#f5f8f8;--sf:#fff;--rz:#e9f0f0;--t1:#132226;--t2:#43575c;--t3:#647a80;--line:rgba(19,34,38,.08);--line2:rgba(19,34,38,.15);--ac:#0f766e;--ac-ink:#0d6961;--ac-soft:rgba(15,118,110,.08);--font:"Public Sans",system-ui,sans-serif;--mono:"Fira Code",monospace}
.d05 .top{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--sf)}.d05 .top .b-st{margin-right:auto}
.d05.sr-open .top .b-st{background:var(--ac-soft);color:var(--ac-ink)}
.d05 .b-sr{left:240px;top:52px;background:rgba(19,34,38,.16)}
.d05 .b-sr .m{left:0;right:0;top:0;height:500px;background:var(--sf);box-shadow:0 18px 40px rgba(19,34,38,.16);display:grid;grid-template-columns:220px 1fr 220px;grid-template-rows:auto minmax(0,1fr)}
.d05 .f{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);color:var(--t3)}.d05 .f input{flex:1;border:0;outline:0;background:none;font:17px var(--font);color:var(--t1)}
.d05 .fc{border-right:1px solid var(--line);padding:12px 16px;overflow:auto}.d05 .fc h5,.d05 .sv h5{font:600 12px var(--font);color:var(--t2);margin:12px 0 6px}
.d05 .fc label{display:flex;align-items:center;gap:8px;font-size:13px;height:28px;color:var(--t1)}.d05 .fc label small{margin-left:auto;font:11px var(--mono);color:var(--t3)}.d05 .fc label.d{color:var(--t3)}
.d05 .fc input{accent-color:var(--ac);margin:0}
.d05 .tb{overflow:auto;padding:4px 0}.d05 .qth,.d05 .qtr{display:grid;grid-template-columns:24px 1fr 110px 72px 72px;gap:10px;align-items:center;padding:0 16px}.d05 .qth{height:34px;font-size:12px;color:var(--t3);border-bottom:1px solid var(--line)}
.d05 .qtr{min-height:44px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)}.d05 .qtr:hover{background:var(--rz)}.d05 .qtr small{display:block;color:var(--t3);font:11px var(--mono)}.d05 .qtr .mono{font-size:12px;color:var(--t2)}
.d05 .sv{border-left:1px solid var(--line);padding:12px 16px;overflow:auto}.d05 .sv button{display:flex;gap:8px;align-items:center;width:100%;height:30px;font-size:13px;border-radius:6px;padding:0 6px;color:var(--t1)}.d05 .sv button:hover{background:var(--rz)}
.d05 .tl{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:12px;color:var(--t3)}.d05 .tl .sp{flex:1}
.d05 .no{display:grid;justify-items:center;text-align:center;gap:8px;padding:56px 24px;color:var(--t2)}.d05 .no b{color:var(--t1);font-weight:500}.d05 .no p{margin:0 0 8px;max-width:380px}

</style>
<script src="_files.js"></script><script src="_nav.js"></script><script src="kit.js"></script><script src="base.js"></script></head>
<body class="mk"><div class="win rfe d05">
 <aside class="side" id="side"></aside>
 <div class="main"><header class="top" id="top"></header><div class="body"><main class="stage" id="st"></main><aside class="rail" id="rail"></aside></div><footer class="bot" id="bot"></footer></div>
 <div class="k-dockwrap" id="dock"></div><div class="pop" id="pop"></div>
</div>
<script>
window.IDEA="For people who search a lot. The sheet opens under the top bar across the page: on the left every filter with how many results it keeps, in the middle the results as a table, on the right your saved and recent searches.";
window.MAP=[["Navigation", "Left sidebar (fixed): Overview, the pages, Computers, Add a computer", 1], ["Files", "Files page (fixed): one tree across every computer, actions on the row", 1], ["Overview, Servers, Devices, Transfers, Tools, History, Settings", "Fixed pages; lists open their details in the inspector on the right", 1], ["Search", "Search button at the left of the top bar, Ctrl K, / or the sidebar", 1], ["Filters", "Left column: kind, computer, changed, size, each with counts", 2], ["Saved searches", "Right column; star to save the current one", 2]];
const I=K.I,D=K.D,E=K.E,EM=B.empty,S=B.S,hl=B.hl,sk=B.sk;

document.getElementById('top').innerHTML=`<button class="b-st" data-k="go:search">${I('search',16)}Search${sk('Ctrl K')}</button>`+K.C.actions();
const cb=(t,n,on,d)=>`<label class="${d?'d':''}"><input type="checkbox"${on?' checked':''}${d?' disabled':''}>${t}<small>${n}</small></label>`;
const search=()=>`<div class="m" role="dialog" aria-label="Search"><label class="f">${I('search',18)}<input value="${S.q}" placeholder="Search by name across your computers" aria-label="Search">${EM?'':K.ib('star','Save this search')}${sk('Esc')}</label>
<div class="fc"><h5>Kind</h5>${EM?cb('Any kind','',1,1):S.types.map(t=>cb(t[0],t[2],0)).join('')}<h5>Computer</h5>${EM?cb('This computer','',1,1):S.pcs.map(p=>cb(p[0],p[2]||p[1],p[1]>0,!p[1])).join('')}<h5>Changed</h5>${['Any time','Today','This week','This month'].map((x,i)=>`<label class="${EM?'d':''}"><input type="radio" name="ch"${i?'':' checked'}>${x}</label>`).join('')}<h5>Size</h5>${['Any size','Over 10 MB','Over 100 MB'].map((x,i)=>`<label class="${EM?'d':''}"><input type="radio" name="sz"${i?'':' checked'}>${x}</label>`).join('')}</div>
<div class="tb">${EM?`<div class="no">${E('card_index_dividers',40)}<b>The filters fill in when there is something to search</b><p>Each computer you add becomes a filter here, with how many results it holds.</p>${K.btn('Add a computer',{i:'plus',k:'pri',a:'dlg:newconn'})}</div>`:`<div class="tl"><span>6 results, newest first</span><span class="sp"></span><span>media-mini offline · nas not trusted: not searched</span></div><div class="qth"><span></span><span>Name</span><span>Computer</span><span>Changed</span><span>Size</span></div>${S.res.map(r=>`<div class="qtr" data-k="sr:go:files">${K.fic(r.k)}<span>${hl(r.n)}<small>${r.path}</small></span><span class="mono">${r.pc}</span><span class="mono">${r.date}</span><span class="mono">${r.size}</span></div>`).join('')}`}</div>
<div class="sv"><h5>Saved</h5>${EM?'<p class="mut" style="font-size:12px">Star a search to keep it here.</p>':S.saved.map(x=>`<button>${E('star',14)}${x}</button>`).join('')}<h5>Recent</h5>${EM?'<p class="mut" style="font-size:12px">None yet.</p>':S.recent.map(x=>`<button>${I('history',14)}${x}</button>`).join('')}</div></div>`;
B.mount({search});

</script></body></html>
