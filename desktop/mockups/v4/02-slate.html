<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Slate — a dropdown under the search icon, filters as tokens in the field</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="base.css">
<style>

.d02{--bg:#f6f7f9;--sf:#fff;--rz:#eceef2;--t1:#15171c;--t2:#4b5160;--t3:#6b7181;--line:rgba(21,23,28,.08);--line2:rgba(21,23,28,.14);--ac:#2f5bd3;--ac-ink:#2a51bd;--ac-soft:rgba(47,91,211,.08);--font:"Geist",system-ui,sans-serif;--mono:"Geist Mono",monospace}
.d02 .top{height:52px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--sf)}
.d02.sr-open .top [data-k="go:search"]{background:var(--rz);color:var(--t1)}
.d02 .b-sr .m{top:48px;right:132px;width:560px;background:var(--sf);border-radius:12px;box-shadow:0 16px 48px rgba(21,23,28,.16),0 0 0 1px var(--line2);overflow:hidden}
.d02 .f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.d02 .f input{flex:1;min-width:120px;border:0;outline:0;background:none;font:15px var(--font);color:var(--t1);height:30px}
.d02 .tk{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 6px 0 8px;border-radius:6px;background:var(--rz);font-size:12px;color:var(--t2)}.d02 .tk b{color:var(--t1);font-weight:500}.d02 .tk.add{background:none;box-shadow:inset 0 0 0 1px dashed;box-shadow:inset 0 0 0 1px var(--line2);color:var(--t3)}
.d02 .g{padding:6px}.d02 .g h4{font:500 11px var(--font);color:var(--t3);margin:6px 8px;display:flex;justify-content:space-between}
.d02 .qr{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px}.d02 .qr:hover,.d02 .qr.on{background:var(--rz)}.d02 .qr small{color:var(--t3);font:11px var(--mono);margin-left:8px}
.d02 .qpc{font:11px var(--mono);color:var(--t2);padding:2px 6px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line2)}
.d02 .ft{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--t3)}.d02 .ft .sp{flex:1}
.d02 .ft .k-btn{height:28px}
.d02 .no{padding:20px 16px;font-size:13px;color:var(--t2);display:grid;gap:10px;justify-items:start}.d02 .no b{color:var(--t1);font-weight:500}

</style>
<script src="_files.js"></script><script src="_nav.js"></script><script src="kit.js"></script><script src="base.js"></script></head>
<body class="mk"><div class="win rfe d02">
 <aside class="side" id="side"></aside>
 <div class="main"><header class="top" id="top"></header><div class="body"><main class="stage" id="st"></main><aside class="rail" id="rail"></aside></div><footer class="bot" id="bot"></footer></div>
 <div class="k-dockwrap" id="dock"></div><div class="pop" id="pop"></div>
</div>
<script>
window.IDEA="Search drops from its icon like any other menu and stays small. Filters are tokens inside the field (where, what kind, when), each one a menu; Add filter offers the rest. The full list opens in Files.";
window.MAP=[["Navigation", "Left sidebar (fixed): Overview, the pages, Computers, Add a computer", 1], ["Files", "Files page (fixed): one tree across every computer, actions on the row", 1], ["Overview, Servers, Devices, Transfers, Tools, History, Settings", "Fixed pages; lists open their details in the inspector on the right", 1], ["Search", "Search icon in the top bar, Ctrl K, / or the sidebar", 1], ["Filters", "Tokens in the field: in, type, changed; Add filter", 2], ["All results", "Show all in Files at the foot", 2]];
const I=K.I,D=K.D,E=K.E,EM=B.empty,S=B.S,hl=B.hl,sk=B.sk;

document.getElementById('top').innerHTML=K.ib('search','Search (Ctrl K)','go:search')+K.C.actions();
const tok=(k,v)=>`<button class="tk" data-k="sr:pick" data-multi>${k} <b>${v}</b>${I('chevd',12)}</button>`;
const search=()=>`<div class="m" role="dialog" aria-label="Search"><div class="f">${I('search',16)}${EM?tok('in','this computer'):tok('in','all computers')+tok('type','any')}<input value="${S.q}" placeholder="${EM?'Search Downloads on this computer':'File or folder name'}" aria-label="Search"><button class="tk add">${I('plus',12)}Add filter</button></div>
${EM?`<div class="no"><b>No computers to search</b>Until you add one, search looks only in this computer’s Downloads folder, where there is nothing yet.${K.btn('Add a computer',{i:'plus',k:'sm pri',a:'dlg:newconn'})}</div>`:`<div class="g"><h4>Files <span>6 found</span></h4>${S.res.map((r,i)=>`<div class="qr${i?'':' on'}" data-k="sr:go:files">${K.fic(r.k)}<span>${hl(r.n)}<small>${r.path}</small></span><span class="qpc">${r.pc}</span></div>`).join('')}</div><div class="g"><h4>Recent searches</h4>${S.recent.map(x=>`<div class="qr">${I('history',14)}<span>${x}</span><span></span></div>`).join('')}</div>`}
<div class="ft">${EM?'<span>Ctrl K opens this from anywhere</span>':'<span>48,210 items · media-mini offline, not searched</span>'}<span class="sp"></span>${EM?'':K.btn('Show all in Files',{k:'sm',i:'right',a:'sr:go:files'})}</div></div>`;
B.mount({search});

</script></body></html>
