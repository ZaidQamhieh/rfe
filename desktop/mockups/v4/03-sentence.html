<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sentence — search written as a sentence you fill in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_frame.css"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="base.css">
<style>

.d03{--bg:#f7f4ec;--sf:#fffdf8;--rz:#eee8da;--t1:#211d16;--t2:#5a5246;--t3:#7a7163;--line:rgba(33,29,22,.09);--line2:rgba(33,29,22,.16);--ac:#2d6a4f;--ac-ink:#245a42;--ac-soft:rgba(45,106,79,.09);--font:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace;--display:"Newsreader",Georgia,serif}
.d03 .top{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 24px;border-bottom:1px solid var(--line)}.d03 .top .d{font:400 18px var(--display);margin-right:auto}
.d03 .b-sr{left:240px;background:rgba(33,29,22,.18)}
.d03 .b-sr .m{left:0;right:0;top:0;background:var(--sf);box-shadow:0 18px 40px rgba(33,29,22,.18);padding:28px 40px 20px;max-height:640px;display:grid;gap:16px}
.d03 .sn{font:400 30px/1.5 var(--display);color:var(--t2);margin:0}
.d03 .sn button{font:inherit;color:var(--t1);border-bottom:2px dotted var(--ac);padding:0 2px;border-radius:0}.d03 .sn button:hover{background:var(--ac-soft)}
.d03 .sn input{font:inherit;color:var(--ac);width:120px;border:0;border-bottom:2px solid var(--ac);background:none;outline:0;padding:0 2px}
.d03 .ln{font-size:12px;color:var(--t3);display:flex;gap:16px;align-items:center}.d03 .ln .sp{flex:1}
.d03 ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;max-height:330px;overflow:auto}
.d03 li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:10px 8px;border-top:1px solid var(--line);cursor:pointer}.d03 li:hover{background:var(--rz)}
.d03 li b{font:400 18px var(--display)}.d03 li small{display:block;color:var(--t3);font:12px var(--mono)}.d03 li .z{font:12px var(--mono);color:var(--t3);text-align:right}
.d03 .no{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line);color:var(--t2)}.d03 .no p{margin:0;flex:1}

</style>
<script src="_files.js"></script><script src="_nav.js"></script><script src="kit.js"></script><script src="base.js"></script></head>
<body class="mk"><div class="win rfe d03">
 <aside class="side" id="side"></aside>
 <div class="main"><header class="top" id="top"></header><div class="body"><main class="stage" id="st"></main><aside class="rail" id="rail"></aside></div><footer class="bot" id="bot"></footer></div>
 <div class="k-dockwrap" id="dock"></div><div class="pop" id="pop"></div>
</div>
<script>
window.IDEA="The search reads as a sentence: find anything named bed on every computer, changed any time. Each underlined word is a menu, so the filters explain themselves. The sheet drops from the top of the page.";
window.MAP=[["Navigation", "Left sidebar (fixed): Overview, the pages, Computers, Add a computer", 1], ["Files", "Files page (fixed): one tree across every computer, actions on the row", 1], ["Overview, Servers, Devices, Transfers, Tools, History, Settings", "Fixed pages; lists open their details in the inspector on the right", 1], ["Search", "Find\u2026 in the top bar, Ctrl K, / or the sidebar", 1], ["Filters", "Each underlined word in the sentence is a menu", 2], ["Open a result", "Click a row: it opens in Files", 2]];
const I=K.I,D=K.D,E=K.E,EM=B.empty,S=B.S,hl=B.hl,sk=B.sk;

document.getElementById('top').innerHTML=`<span class="d">Sunday, 1 November</span><button class="b-st" data-k="go:search">${I('search',16)}Find…${sk('Ctrl K')}</button>`+K.C.actions();
const w=t=>`<button data-k="sr:pick">${t}</button>`;
const search=()=>`<div class="m" role="dialog" aria-label="Search"><p class="sn">Find ${w('anything')} named <input value="${S.q}" aria-label="Name" placeholder="…"> on ${w(EM?'this computer’s Downloads':'every computer')}, changed ${w('any time')}${EM?'':`, of ${w('any size')}`}.</p>
${EM?`<div class="no">${E('seedling',32)}<p>Your computers are not here yet. Once you add one, this sentence can name it, and search reaches every folder it lets you open.</p>${K.btn('Add a computer',{i:'plus',k:'pri',a:'dlg:newconn'})}</div>`:`<div class="ln"><span>6 found on studio-pc and work-laptop · media-mini is offline, nas is not trusted</span><span class="sp"></span>${K.btn('Save this sentence',{k:'sm ghost',i:'star'})}${K.btn('Open all in Files',{k:'sm',a:'sr:go:files'})}</div><ol>${S.res.map(r=>`<li data-k="sr:go:files">${K.fic(r.k)}<span><b>${hl(r.n)}</b><small>${r.pc} · ${r.path}</small></span><span class="z">${r.date}<br>${r.size}</span></li>`).join('')}</ol>`}</div>`;
B.mount({search});

</script></body></html>
