[package]
name = "rfe-desktop"
version = "1.0.3"
description = "RFE desktop PC control app (first slice: pin, log in, list devices)"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "rfe_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "rfe-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
ed25519-dalek = "2"
getrandom = "0.2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
mdns-sd = "0.21"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# One OS keystore backend per platform, and nothing else: keyring silently falls back to an
# in-memory mock when no backend feature is enabled, which would lose the secrets on exit.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

# Debug and test builds. Each tests/*.rs links the whole app into its own executable, and full debug info made
# each one about 350 MB (a target dir reached 71 GB). Line tables keep backtraces and panic locations; dependencies
# get no debug info at all. A debugger loses local variables: set `debug = true` locally if you need them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The shipped binary: smaller and with less of it touched at run time. Measured on the same code in the
# real window, with the WebKit processes unchanged: 21.8 MB -> 8.4 MB on disk and 53.0 -> 49.6 MB for
# the app's own process. Unwinding stays on (a panic in a command must not end the app).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
